<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>카이팅 훈련장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one dark arena screen — slim header, stat strip, full-width canvas, key legend below. Single dark look by choice. */
:root {
  --bg: #0d1315;
  --panel: #151e21;
  --rule: #253338;
  --fg: #e4ede8;
  --muted: #8199a0;
  --gold: #f2c14e;
  --move: #4fd1a5;
  --enemy: #e8574a;
  --danger: #ff6b5e;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { background: var(--bg); color: var(--fg); }
body {
  margin: 0;
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 12px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.9rem; margin: 0; letter-spacing: .01em; text-wrap: balance; }
h1 span { color: var(--gold); }
.sub { color: var(--muted); margin: 2px 0 0; font-size: .9rem; }
.btn {
  font: 600 .85rem var(--font-body); color: var(--gold); background: transparent;
  border: 1px solid var(--gold); border-radius: 8px; padding: 8px 12px; cursor: pointer;
}
.btn:hover { background: color-mix(in srgb, var(--gold) 14%, transparent); }
button:focus-visible { outline: 2px solid var(--move); outline-offset: 2px; }

.stats {
  display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 1px; margin: 0;
  background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden;
}
.stat { background: var(--panel); padding: 8px 12px; min-width: 0; }
.stat dt { font-size: .7rem; color: var(--muted); letter-spacing: .06em; }
.stat dd { margin: 2px 0 0; font: 700 1.15rem var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }

.arena {
  position: relative; height: clamp(340px, 66vh, 700px); border-radius: 12px; overflow: hidden;
  border: 1px solid var(--rule); background: #0a0f11; touch-action: none; user-select: none;
}
canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }
.overlay {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; cursor: pointer;
  background: color-mix(in srgb, #050809 72%, transparent); padding: 16px;
}
.card { max-width: 440px; display: grid; gap: 12px; justify-items: center; }
.card h2 { font-family: var(--font-display); font-weight: 400; font-size: 2rem; margin: 0; }
.card p { margin: 0; color: var(--muted); line-height: 1.6; }
.card .big { font: 700 1rem var(--font-mono); color: var(--fg); line-height: 1.8; }
.card .big b { color: var(--gold); }
.go { font: 400 1.2rem var(--font-display); background: var(--gold); color: #1b1404; border-radius: 10px; padding: 12px 28px; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: .85rem; }
kbd { font: 600 .75rem var(--font-mono); color: var(--fg); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; background: var(--panel); }

@media (max-width: 640px) {
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  h1 { font-size: 1.5rem; }
}
</style>

</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>카이팅 <span>훈련장</span></h1>
      <p class="sub">미니언이 랜덤한 곳에 나타납니다. 1초 안에 우클릭하세요.</p>
    </div>
    <button class="btn" id="restart" type="button">다시 시작</button>
  </header>

  <dl class="stats">
    <div class="stat"><dt>남은 시간</dt><dd id="s-time">30.0s</dd></div>
    <div class="stat"><dt>명중</dt><dd id="s-hit">0</dd></div>
    <div class="stat"><dt>놓침 (1초 초과)</dt><dd id="s-miss">0</dd></div>
    <div class="stat"><dt>헛클릭</dt><dd id="s-wrong">0</dd></div>
    <div class="stat"><dt>정확도</dt><dd id="s-acc">–</dd></div>
    <div class="stat"><dt>평균 반응</dt><dd id="s-rt">–</dd></div>
  </dl>

  <div class="arena" id="arena">
    <canvas id="cv"></canvas>
    <div class="overlay" id="overlay">
      <div class="card" id="card">
        <h2>카이팅 훈련장</h2>
        <p>미니언 크기의 표적이 랜덤한 위치에 나타나고 <b style="color:var(--gold)">1초 뒤에 사라집니다</b>.<br>
        사라지기 전에 <b style="color:var(--move)">우클릭</b>으로 맞히세요. 한 판은 30초예요.</p>
        <span class="go">클릭해서 시작</span>
      </div>
    </div>
  </div>

  <div class="legend">
    <span><kbd>우클릭</kbd> 표적 맞히기</span>
    <span><kbd>Space</kbd> 시작 / 재시작</span>
    <span>모바일: 탭</span>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('cv');
  const ctx = cv.getContext('2d');
  const arena = document.getElementById('arena');
  const overlay = document.getElementById('overlay');
  const card = document.getElementById('card');
  const $ = id => document.getElementById(id);

  const ROUND = 30, LIFE = 1.0, R = 16, GAP = 0.12, PAD = 30;
  let W = 800, H = 500, dpr = 1;
  let G = null, running = false;

  function resize() {
    const r = arena.getBoundingClientRect();
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = r.width; H = r.height;
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function newGame() {
    G = { t: ROUND, target: null, wait: 0.4, hit: 0, miss: 0, wrong: 0, rts: [], marks: [], last: null };
  }

  function start() {
    newGame();
    overlay.hidden = true;
    running = true;
    last = performance.now();
  }

  function spawn() {
    let x, y, tries = 0;
    do {
      x = PAD + Math.random() * (W - PAD * 2);
      y = PAD + Math.random() * (H - PAD * 2);
      tries++;
      // 직전 위치와 너무 가깝지 않게 해서 마우스를 크게 움직이게 함
    } while (G.last && Math.hypot(x - G.last.x, y - G.last.y) < Math.min(W, H) * 0.3 && tries < 20);
    G.target = { x, y, age: 0 };
    G.last = { x, y };
  }

  function endGame() {
    running = false;
    G.target = null;
    const tries = G.hit + G.miss;
    const acc = tries ? Math.round(G.hit / tries * 100) : 0;
    const rt = G.rts.length ? Math.round(G.rts.reduce((a, b) => a + b, 0) / G.rts.length * 1000) : 0;
    let best = 0;
    try { best = +localStorage.getItem('kite-click-best') || 0; if (G.hit > best) localStorage.setItem('kite-click-best', G.hit); } catch (e) {}
    card.innerHTML = `
      <h2>${G.hit > best ? '신기록!' : '끝!'}</h2>
      <div class="big">
        명중 <b>${G.hit}</b> ${G.hit > best ? '' : `(최고 ${best})`}<br>
        놓침 ${G.miss} · 헛클릭 ${G.wrong}<br>
        정확도 ${acc}% · 평균 반응 ${rt ? rt + 'ms' : '–'}
      </div>
      <span class="go">클릭해서 다시 하기</span>`;
    overlay.hidden = false;
  }

  function update(dt) {
    G.t -= dt;
    if (G.t <= 0) { G.t = 0; endGame(); return; }
    if (G.target) {
      G.target.age += dt;
      if (G.target.age >= LIFE) {
        G.miss++;
        G.marks.push({ x: G.target.x, y: G.target.y, t: 0.4, c: 'miss' });
        G.target = null; G.wait = GAP;
      }
    } else {
      G.wait -= dt;
      if (G.wait <= 0) spawn();
    }
    for (const m of G.marks) m.t -= dt;
    G.marks = G.marks.filter(m => m.t > 0);
  }

  function shoot(x, y) {
    const tg = G.target;
    if (tg && Math.hypot(x - tg.x, y - tg.y) <= R + 4) {
      G.hit++; G.rts.push(tg.age);
      G.marks.push({ x: tg.x, y: tg.y, t: 0.4, c: 'hit' });
      G.target = null; G.wait = GAP;
    } else {
      G.wrong++;
      G.marks.push({ x, y, t: 0.4, c: 'wrong' });
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(129,153,160,0.07)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < W; x += 40) { ctx.moveTo(x + .5, 0); ctx.lineTo(x + .5, H); }
    for (let y = 0; y < H; y += 40) { ctx.moveTo(0, y + .5); ctx.lineTo(W, y + .5); }
    ctx.stroke();
    if (!G) return;

    const tg = G.target;
    if (tg) {
      const k = 1 - tg.age / LIFE;
      // 남은 시간 링
      ctx.strokeStyle = 'rgba(242,193,78,0.18)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(tg.x, tg.y, R + 7, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = k < 0.3 ? '#ff6b5e' : '#f2c14e';
      ctx.beginPath(); ctx.arc(tg.x, tg.y, R + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * k); ctx.stroke();
      // 미니언
      ctx.fillStyle = '#e8574a';
      ctx.beginPath(); ctx.arc(tg.x, tg.y, R, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.35)';
      ctx.beginPath(); ctx.arc(tg.x, tg.y, R * 0.45, 0, Math.PI * 2); ctx.fill();
    }

    for (const m of G.marks) {
      const k = m.t / 0.4;
      ctx.lineWidth = 2;
      if (m.c === 'hit') {
        ctx.strokeStyle = `rgba(79,209,165,${k})`;
        ctx.beginPath(); ctx.arc(m.x, m.y, R + (1 - k) * 16, 0, Math.PI * 2); ctx.stroke();
      } else if (m.c === 'miss') {
        ctx.strokeStyle = `rgba(232,87,74,${k * 0.6})`; ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.arc(m.x, m.y, R, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      } else {
        ctx.strokeStyle = `rgba(255,107,94,${k})`;
        ctx.beginPath(); ctx.moveTo(m.x - 6, m.y - 6); ctx.lineTo(m.x + 6, m.y + 6); ctx.moveTo(m.x + 6, m.y - 6); ctx.lineTo(m.x - 6, m.y + 6); ctx.stroke();
      }
    }
  }

  function hud() {
    if (!G) return;
    const tries = G.hit + G.miss;
    $('s-time').textContent = G.t.toFixed(1) + 's';
    $('s-hit').textContent = G.hit;
    $('s-miss').textContent = G.miss;
    $('s-wrong').textContent = G.wrong;
    $('s-acc').textContent = tries ? Math.round(G.hit / tries * 100) + '%' : '–';
    $('s-rt').textContent = G.rts.length ? Math.round(G.rts.reduce((a, b) => a + b, 0) / G.rts.length * 1000) + 'ms' : '–';
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (running) update(dt);
    draw(); hud();
    requestAnimationFrame(loop);
  }

  function pos(ev) { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; }
  arena.addEventListener('contextmenu', e => e.preventDefault());
  overlay.addEventListener('pointerdown', e => { e.preventDefault(); start(); });
  cv.addEventListener('pointerdown', e => {
    if (!running) return;
    e.preventDefault();
    if (e.pointerType === 'mouse' && e.button !== 2) return;
    const q = pos(e);
    shoot(q.x, q.y);
  });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); start(); }
  });
  $('restart').addEventListener('click', e => { e.currentTarget.blur(); start(); });

  new ResizeObserver(resize).observe(arena);
  resize();
  newGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
