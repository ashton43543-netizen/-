<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arcane Drift</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* Layout: one 16:9 game canvas centred on a dark lab-floor ground, a single line of controls under it.
   Deliberately single-theme (the game is a dark lab), so every colour is set explicitly. */
:root {
  --ground: #0b1014;
  --panel: #131a20;
  --ink: #e9e6f5;
  --muted: #9a93b5;
  --accent: #c9b6ff;
  --f-title: "Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --f-body: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--ground); color: var(--ink); font-family: var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
}
.wrap { display: grid; justify-items: center; gap: 8px; }
canvas { display: block; background: #131a20; border-radius: 10px; outline: none; max-width: 100%; touch-action: none; cursor: crosshair; }
canvas:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.note { margin: 0; font-size: 13px; color: var(--muted); text-align: center; text-wrap: balance; }
.note kbd { font-family: var(--f-body); font-size: 12px; padding: 1px 6px; border-radius: 5px; border: 1px solid #2a3340; border-bottom-width: 2px; color: var(--ink); background: var(--panel); }
</style>
</head>
<body>

<div class="wrap">
  <canvas id="game" tabindex="0" aria-label="Arcane Drift 게임 화면. 마우스와 키보드로 플레이합니다"></canvas>
  <p class="note">
    <kbd>우클릭</kbd> 이동 · <kbd>좌클릭</kbd> 공격할 적 지정 · <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> 스킬 ·
    <kbd>1</kbd>~<kbd>4</kbd> 카드 · <kbd>Tab</kbd> 내 빌드 · <kbd>Esc</kbd> 일시정지 · 키보드와 마우스가 필요해요
  </p>
</div>

<script>

// 좌표는 Unity 와 같은 유닛(위쪽이 +y)으로 계산하고, 그릴 때만 화면 픽셀로 바꾼다.
(() => {
  'use strict';

  // ================================================================== 수치 (Unity 의 Tune 과 같다)
  const T = {
    CameraSize: 4.5, PlayerRadius: 0.15, PlayerSpeed: 2.5, PlayerSpeedVsMonster: 1.8, PlayerHp: 100, PlayerDamage: 10,
    PlayerAspd: 1.1, PlayerRange: 3.4, BasicDamageBoost: 2, CritChance: 0.05, CritMult: 1.6, BoltSpeed: 5.6,
    XpMagnet: 4, CardPickDelay: 0.7, XpPickup: 0.34, XpRequirement: 0.6, StartingAugments: 1,
    SpawnMin: 5.6, SpawnMax: 7, SpawnIntervalMult: 1.4, DamagePerLevel: 0.04,
    EliteEvery: 22, EliteHp: 5, EliteDamage: 1.8, EliteSpeed: 0.85, EliteRadius: 1.6, EliteXp: 6,
    BossEvery: 90, BossSpeed: 0.66, BossXp: 120, BossShots: 6,
    BigBossEveryNthBoss: 4, BigBossSpeed: 0.58, BigBossXp: 300, BigBossShots: 10,
    QSpeed: 6.2, MaxSkillLevel: 5, EvolveDamage: [1.6, 1.5, 1.5], SkillDamageBoost: 4.5, ShakeStrength: 0.12,
    WEvolveRadius: 0.7, WEvolveStun: 0.6, EDashSteps: 14, EBuffAspd: 0.6, EBuffTime: 2, EEvolveRefund: 0.7,
    CardCount: 4, RarityWeight: [100, 55, 25, 8], MaxEnemies: 300, RecycleDistance: 11,
    ContactCooldown: 0.7, ClickAssist: 0.6, BoltRadius: 0.06, BoltLife: 2,
    QRange: 6.5, QRadius: 0.14, QExplodeRadius: 0.9, QExplodeRatio: 0.8, WKnockback: 4, EHitPadding: 0.12,
    BossRadius: 0.45, BigBossRadius: 0.65, BossResist: 0.15,
    BarrageRange: 4.5, BossBarrageEvery: 2.2, BigBossBarrageEvery: 1.8,
    BulletSpeed: 2.4, BulletRadius: 0.08, BulletDamageRatio: 0.5, BulletLife: 5,
    SkillUnlockWeight: 110, SkillLevelWeight: 75, PassiveUnlockWeight: 110, PassiveLevelWeight: 75, PassiveEvolveDamage: 1.5,

    ShurikenFastMult: 1.6, ShurikenFastDamage: 1.2,
    MeteorCoef: 2.5, MeteorRadius: 0.9, MeteorFall: 0.55, MeteorProcCooldown: 0.25, MeteorBigSize: 1.4, MeteorBigDamage: 1.25,
    BurnTime: 3, BurnTick: 0.5, BurnRatio: 0.12,
    VortexCoef: 0.2, VortexCollapseCoef: 3, VortexRadius: 1.1, VortexTime: 2.4, VortexTick: 0.3, VortexPull: 2.4, VortexProcCooldown: 1,
    QSpreadDeg: 12, QGiantSize: 1.8, QGiantDamage: 1.25, QTrailEvery: 0.8, QTrailRadius: 0.45, QTrailRatio: 0.35,
    WDoubleDelay: 0.4, WDoubleRatio: 0.7, WPullDamage: 1.2,
    EAfterDelay: 0.3, EAfterRatio: 0.6, EAfterRadius: 0.6, EGuardTime: 0.8,
    HitExplodeRadius: 0.6, AftermathRadius: 0.8, KillExplodeRadius: 0.7,
    ChainRange: 1.8, ChainRatio: 0.5, RicochetRange: 2.5, ChainTargets: 3,
    SynergyCdCut: 1, SynergyDamage: 1.3, MinSkillCdMult: 0.4, HealCard: 30,
    MaxOrbs: 300, MaxTexts: 80, MaxFx: 700,
  };
  const attackLock = aspd => Math.min(0.22, 0.4 / aspd);
  const xpToNext = lv => Math.max(1, Math.round((10 + lv * 7 + lv * lv * 0.6) * T.XpRequirement));
  const spawnInterval = t => Math.max(0.16, 1.05 - t * 0.002) * T.SpawnIntervalMult;
  const spawnCount = t => Math.min(1 + Math.floor(t / 45), 4);
  const hpScale = t => 1 + t / 50;
  const damageScale = t => 1 + t / 140;
  const speedScale = t => 1 + Math.min(t / 320, 0.7);
  const bossHp = t => 650 * (1 + t / 70), bossDamage = t => 20 * (1 + t / 200);
  const bigBossHp = t => 2200 * (1 + t / 70), bigBossDamage = t => 34 * (1 + t / 200);
  const qDamage = lv => 1.8 + lv * 0.35, wDamage = lv => 1.2 + lv * 0.3, eDamage = lv => 1.1 + lv * 0.25;
  const wRadius = lv => 1.5 + lv * 0.14, eDistance = lv => 2.3 + lv * 0.22;
  function skillCooldown(skill, lv, mult) {
    const base = skill === 0 ? 3.0 - lv * 0.28 : skill === 1 ? 6.5 - lv * 0.5 : 5.5 - lv * 0.45;
    return Math.max(1.2, base * mult);
  }

  // ================================================================== 색
  const P = {
    ground: '#131a20', marker: '#6bd5ff', muzzle: '#e4c8ff', haste: '#b8eeff', stunned: '#b9a2ff',
    skillHit: '#8fe9ff', passiveHit: '#c6f2ff', shuriken: '#bfe3ff', meteor: '#ff6a2b', vortex: '#9b6bff',
    target: '#ff6b6b', bolt: '#e4d8ff', qbolt: '#6bd5ff', void: '#9b6bff', dash: '#6bd5ff', elite: '#f0b429',
    boss: '#e0508c', bigBoss: '#ff7a3d', bullet: '#ff6b9a', xp: '#5ee3a1', explosion: '#ff9f4a', chain: '#8fd3ff',
    crit: '#ffd166', hurt: '#ff5a5a', white: '#ffffff', body: '#d6d0ea', muted: '#9a93b5', locked: '#5c5675',
    hpBar: '#e5484d', skill: '#6be3a8', legendary: '#ffb84d', card: '#231e36', cardHover: '#2f2848',
    buttonPrimary: '#6e56cf', buttonSecondary: '#3a3352', panel: 'rgba(13,10,23,0.78)',
    rarity: ['#a8b3c7', '#59c3ff', '#c38bff', '#ffb84d'],
  };
  const rgbCache = new Map();
  function rgb(hex) {
    let v = rgbCache.get(hex);
    if (!v) { const n = parseInt(hex.slice(1), 16); v = [(n >> 16) & 255, (n >> 8) & 255, n & 255]; rgbCache.set(hex, v); }
    return v;
  }
  const fade = (hex, a) => { const c = rgb(hex); return `rgba(${c[0]},${c[1]},${c[2]},${Math.max(0, Math.min(1, a))})`; };
  const mix = (a, b, t) => { const x = rgb(a), y = rgb(b); const h = i => Math.round(x[i] + (y[i] - x[i]) * t).toString(16).padStart(2, '0'); return '#' + h(0) + h(1) + h(2); };

  // ================================================================== 도트 그림 (Unity 의 PixelCanvas 와 같은 방식)
  const INK = [27, 21, 48, 255], WHITE = [255, 255, 255, 255];
  const C = hex => { const c = rgb(hex); return [c[0], c[1], c[2], 255]; };

  class PixelCanvas {
    constructor(w, h) { this.w = w; this.h = h; this.px = new Uint8ClampedArray(w * h * 4); }
    inside(x, y) { return x >= 0 && y >= 0 && x < this.w && y < this.h; }
    set(x, y, c) { if (!this.inside(x, y)) return; const i = (y * this.w + x) * 4; this.px[i] = c[0]; this.px[i + 1] = c[1]; this.px[i + 2] = c[2]; this.px[i + 3] = c[3]; }
    alpha(x, y, a = this.px) { return this.inside(x, y) ? a[(y * this.w + x) * 4 + 3] : 0; }
    ellipse(cx, cy, rx, ry, c) {
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) {
        const dx = (x + 0.5 - cx) / rx, dy = (y + 0.5 - cy) / ry;
        if (dx * dx + dy * dy <= 1) this.set(x, y, c);
      }
    }
    rect(x0, y0, w, h, c) { for (let y = y0; y < y0 + h; y++) for (let x = x0; x < x0 + w; x++) this.set(x, y, c); }
    shade(c, where) { for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++) if (this.alpha(x, y) > 0 && where(x, y)) this.set(x, y, c); }
    outline(c) {
      const before = this.px.slice();
      for (let y = 0; y < this.h; y++) for (let x = 0; x < this.w; x++)
        if (!this.alpha(x, y, before) && (this.alpha(x - 1, y, before) || this.alpha(x + 1, y, before) || this.alpha(x, y - 1, before) || this.alpha(x, y + 1, before))) this.set(x, y, c);
    }
    // silhouette: 모양만 흰색 (맞았을 때 번쩍임), tint: 색 곱하기, alphaMul: 전체 투명도
    toCanvas({ silhouette = false, tint = null } = {}) {
      const cv = document.createElement('canvas'); cv.width = this.w; cv.height = this.h;
      const g = cv.getContext('2d'); const img = g.createImageData(this.w, this.h);
      for (let i = 0; i < this.px.length; i += 4) {
        let r = this.px[i], gg = this.px[i + 1], b = this.px[i + 2]; const a = this.px[i + 3];
        if (silhouette && a > 0) r = gg = b = 255;
        if (tint) { r = r * tint[0] / 255; gg = gg * tint[1] / 255; b = b * tint[2] / 255; }
        img.data[i] = r; img.data[i + 1] = gg; img.data[i + 2] = b; img.data[i + 3] = a;
      }
      g.putImageData(img, 0, 0);
      return cv;
    }
  }

  function fromRows(rows, palette) {
    const c = new PixelCanvas(rows[0].length, rows.length);
    rows.forEach((row, y) => [...row].forEach((ch, x) => { const col = palette[ch]; if (col) c.set(x, y, col); }));
    return c;
  }

  // ---- 플레이어: 16×20, 오른쪽을 보고 있다 ----
  const HERO_TOP = [
    '................', '.....KKKKKK.....', '...KKHHHHHHKK...', '..KHHHHHHHHHHK..', '.KHHHHHHHHHHHHK.', 'KRRRRRRRRRRRRRK.',
    'RRKHSSSSSSSSHK..', 'KRKSSSSWESWESK..', '.KKSSSSWESWESK..', '..KSSppSSSSpSK..', '...KSSSSSSSSK...', '....KKKKKKKK....',
    '...KBBBBBBBK....', '..KBBYBBBBSKKKK.', '..KbBYBBBSGGGCCK', '..KbBBBBBKKgKKK.', '...KTTTTTK......',
  ];
  const HERO_LEGS_IDLE = ['...KPPKPPK......', '...KOOKOOK......', '....KK.KK.......'];
  const HERO_LEGS_STEP = ['..KPPK.KPPK.....', '..KOOK.KOOK.....', '...KK...KK......'];
  const HERO_COLORS = {
    K: INK, H: [92, 58, 38, 255], R: [229, 72, 77, 255], S: [255, 214, 176, 255], p: [255, 160, 150, 255], W: WHITE, E: INK,
    B: [62, 123, 214, 255], b: [44, 90, 168, 255], Y: [255, 201, 74, 255], T: [255, 201, 74, 255], G: [110, 114, 132, 255],
    g: [70, 72, 88, 255], C: [190, 140, 255, 255], P: [52, 46, 74, 255], O: [120, 78, 48, 255],
  };
  const PPU = 32;                                  // 도트 그림은 1유닛 = 32픽셀
  const HERO_PIVOT_Y = 0.3, HERO_FEET = 20 * HERO_PIVOT_Y / PPU;
  const HERO_GUN_X = 7.5 / PPU, HERO_GUN_Y = -0.5 / PPU;

  // ---- 몬스터 ----
  const LOOK = { slime: 0, flask: 1, brute: 2, goggle: 3, mutant: 4 }, ELITE_OFFSET = 5;
  function eye(c, x, y, size) {
    c.rect(x, y, size, size, WHITE);
    if (size <= 2) c.rect(x + size - 1, y, 1, size, INK);
    else { c.rect(x + 1, y + 1, size - 1, size - 1, INK); c.set(x + 1, y + 1, WHITE); }
  }
  function paintSlime(t) {
    const c = new PixelCanvas(13, 12);
    c.ellipse(6.5, 7.6, 5.6, 3.6, t.body); c.ellipse(6.5, 5.2, 4.4, 4.0, t.body);
    c.shade(t.shade, (x, y) => y >= 9); c.ellipse(4.3, 3.6, 1.3, 1.0, t.light);
    eye(c, 6, 5, 2); eye(c, 9, 5, 2); c.set(8, 8, INK); c.set(9, 8, INK);
    c.outline(INK); return c;
  }
  function paintFlask(t) {
    const c = new PixelCanvas(11, 13); const glass = C('#d8eef5'), rim = C('#a9cbd6');
    c.rect(4, 1, 3, 4, glass); c.rect(3, 1, 5, 1, rim);
    for (let y = 5; y <= 10; y++) { const half = 1.6 + (y - 5) * 0.65; for (let x = 0; x < 11; x++) if (Math.abs(x + 0.5 - 5.5) <= half) c.set(x, y, glass); }
    c.shade(t.body, (x, y) => y >= 7); c.shade(t.shade, (x, y) => y === 10);
    c.set(5, 3, t.light); c.set(3, 9, t.light); eye(c, 4, 7, 2); eye(c, 7, 7, 2); c.set(3, 11, INK); c.set(7, 11, INK);
    c.outline(INK); return c;
  }
  function paintBrute(t) {
    const c = new PixelCanvas(16, 16); const horn = C('#f2e2c0');
    c.ellipse(8, 9.2, 7.0, 5.8, t.body);
    c.rect(3, 2, 2, 3, horn); c.set(3, 1, horn); c.rect(11, 2, 2, 3, horn); c.set(12, 1, horn);
    c.shade(t.shade, (x, y) => y >= 12); c.ellipse(5, 6.5, 1.6, 1.0, t.light);
    eye(c, 7, 7, 2); eye(c, 11, 7, 2);
    c.set(6, 6, INK); c.set(7, 6, INK); c.set(12, 6, INK); c.set(13, 6, INK);
    c.rect(7, 11, 6, 2, INK); c.set(8, 11, WHITE); c.set(11, 11, WHITE);
    c.outline(INK); return c;
  }
  function paintGoggleSlime() {
    const c = new PixelCanvas(28, 26);
    const body = C('#e0508c'), shade = C('#b23a6c'), light = C('#ff9cc4'), rimC = C('#9aa3b5'), lens = C('#6bd5ff'), strap = C('#3a3352');
    c.ellipse(14, 16.5, 12.6, 8.4, body); c.ellipse(14, 11, 9.5, 8.5, body);
    c.shade(shade, (x, y) => y >= 21); c.ellipse(8.5, 5.5, 2.4, 1.5, light);
    c.shade(strap, (x, y) => y === 10 || y === 11);
    c.ellipse(11, 11, 3.6, 3.6, rimC); c.ellipse(19, 11, 3.6, 3.6, rimC);
    c.ellipse(11, 11, 2.5, 2.5, lens); c.ellipse(19, 11, 2.5, 2.5, lens);
    c.rect(11, 11, 2, 2, INK); c.rect(19, 11, 2, 2, INK); c.set(10, 10, WHITE); c.set(18, 10, WHITE);
    c.set(11, 17, INK); c.rect(12, 18, 7, 2, INK); c.set(19, 17, INK); c.rect(14, 19, 3, 1, C('#ff7aa8'));
    c.outline(INK); return c;
  }
  function paintMutant() {
    const c = new PixelCanvas(42, 38);
    const body = C('#ff7a3d'), shade = C('#d2552a'), light = C('#ffb27e'), spot = C('#e0662f');
    const glass = [207, 232, 240, 210], brain = C('#ff9fc0'), brainLine = C('#d9668c'), rimC = C('#7d8797');
    c.ellipse(21, 25, 19.5, 11.6, body); c.ellipse(21, 19, 14, 10, body);
    c.ellipse(21, 10.5, 9, 8.6, glass); c.ellipse(21, 12, 6.5, 4.8, brain);
    [[18, 10], [19, 11], [21, 9], [22, 10], [24, 12], [17, 13], [21, 14]].forEach(([x, y]) => c.set(x, y, brainLine));
    c.rect(15, 4, 1, 4, WHITE); c.rect(16, 3, 1, 2, WHITE); c.rect(12, 18, 18, 2, rimC);
    c.shade(shade, (x, y) => y >= 33);
    c.ellipse(8, 27, 2, 1.5, spot); c.ellipse(34, 28, 2.4, 1.6, spot); c.ellipse(30, 34, 1.6, 1.1, spot); c.ellipse(9, 22, 2.2, 1.2, light);
    eye(c, 12, 22, 3); eye(c, 19, 21, 3); eye(c, 26, 22, 3);
    c.rect(12, 28, 18, 5, INK);
    for (let x = 13; x < 28; x += 3) { c.set(x, 28, WHITE); c.set(x + 1, 28, WHITE); c.set(x, 29, WHITE); }
    for (let x = 14; x < 29; x += 3) { c.set(x, 32, WHITE); c.set(x + 1, 32, WHITE); c.set(x + 1, 31, WHITE); }
    c.outline(INK); return c;
  }
  const tone = (b, s, l) => ({ body: C(b), shade: C(s), light: C(l) });
  const GOLD = tone('#f0b429', '#c08410', '#ffe38a');

  function paintXpDrop() {
    const c = new PixelCanvas(7, 9); const body = [235, 235, 235, 255], sh = [170, 170, 180, 255];
    c.set(3, 1, body); c.rect(3, 2, 1, 1, body); c.rect(2, 3, 3, 1, body); c.ellipse(3.5, 5.6, 2.6, 2.5, body);
    c.shade(sh, (x, y) => x >= 4 && y >= 6); c.set(2, 4, WHITE); c.outline([40, 44, 60, 255]);
    return c;
  }
  function paintMeteor() {
    const c = new PixelCanvas(12, 12);
    c.ellipse(6, 6, 5, 4.6, C('#6b4a3a')); c.shade(C('#4a3128'), (x, y) => x + y >= 13); c.ellipse(4.5, 4.2, 1.6, 1.1, C('#9a7058'));
    c.set(6, 6, C('#ff9a3c')); c.set(7, 7, C('#ff9a3c')); c.set(5, 8, C('#ffd166')); c.set(8, 5, C('#ff9a3c'));
    c.outline(INK); return c;
  }
  function paintSpiral(px) {
    const c = new PixelCanvas(px, px); const mid = px / 2, r = px / 2 - 1;
    for (let y = 0; y < px; y++) for (let x = 0; x < px; x++) {
      const dx = x + 0.5 - mid, dy = y + 0.5 - mid, d = Math.sqrt(dx * dx + dy * dy) / r;
      if (d > 1) continue;
      const arm = Math.sin(3 * Math.atan2(dy, dx) + d * 9);
      if (d < 0.18) c.set(x, y, [20, 10, 40, 255]);
      else if (arm > 0.35) c.set(x, y, [255, 255, 255, Math.round(255 * (1 - d * 0.6))]);
      else if (arm > -0.2) c.set(x, y, [160, 150, 190, Math.round(150 * (1 - d))]);
    }
    return c;
  }
  function paintPuddle() {
    const c = new PixelCanvas(24, 24); const body = [220, 220, 220, 220], rimC = WHITE;
    c.ellipse(12, 12.5, 9, 8, body); c.ellipse(7, 9, 5, 4.5, body); c.ellipse(17, 15, 5.5, 5, body); c.ellipse(15, 7, 4.5, 4, body);
    c.outline(rimC); c.set(9, 9, rimC); c.set(10, 9, rimC); c.set(15, 14, rimC);
    return c;
  }

  // ---- 실험실 바닥: 16×16유닛 무늬 (Unity 와 같은 방법, 무작위 씨앗만 다르다) ----
  const FLOOR_UNITS = 16, TILE_PX = 32;
  function paintLabFloor() {
    const n = FLOOR_UNITS * TILE_PX, f = new Uint8ClampedArray(n * n * 4);
    let seed = 20261030;
    const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    const next = (a, b) => a + Math.floor(rnd() * (b - a));   // [a, b)
    const wrap = v => ((v % n) + n) % n;
    const put = (x, y, c) => { const i = (wrap(y) * n + wrap(x)) * 4; f[i] = c[0]; f[i + 1] = c[1]; f[i + 2] = c[2]; f[i + 3] = 255; };
    const blend = (x, y, c, a) => { const i = (wrap(y) * n + wrap(x)) * 4; for (let k = 0; k < 3; k++) f[i + k] = f[i + k] + (c[k] - f[i + k]) * a; f[i + 3] = 255; };
    const vary = (c, d) => [c[0] + d, c[1] + d, c[2] + d, 255].map(v => Math.max(0, Math.min(255, v)));
    for (let ty = 0; ty < FLOOR_UNITS; ty++) for (let tx = 0; tx < FLOOR_UNITS; tx++) {
      const roll = next(0, 100), grate = roll < 8, panel = roll >= 8 && roll < 14;
      const tile = grate ? C('#18222a') : panel ? C('#1d2a33') : vary(C('#23313b'), next(-3, 4));
      for (let y = 0; y < TILE_PX; y++) for (let x = 0; x < TILE_PX; x++) {
        let c = tile;
        if (x === 0 || y === 0) c = C('#111920');
        else if (x === 1 || y === TILE_PX - 1) c = vary(tile, 9);
        else if (x === TILE_PX - 1 || y === 1) c = vary(tile, -7);
        else if (grate && x >= 5 && x < 27 && y >= 5 && y < 27) c = y % 4 < 2 ? C('#0c1216') : C('#2b3843');
        else if (grate && (x === 3 || x === 28) && (y === 3 || y === 28)) c = C('#56687a');
        put(tx * TILE_PX + x, ty * TILE_PX + y, c);
      }
    }
    for (let i = 0; i < n; i++) for (let k = 0; k < 3; k++) { blend(i, 5 * TILE_PX + 14 + k, C('#6f8596'), 0.28); blend(11 * TILE_PX + 14 + k, i, C('#6f8596'), 0.28); }
    for (let s = 0; s < 4; s++) {
      const x0 = next(0, FLOOR_UNITS) * TILE_PX, y0 = next(0, FLOOR_UNITS) * TILE_PX + 12, horizontal = s % 2 === 0, len = TILE_PX * next(2, 5);
      for (let a = 0; a < len; a++) for (let b = 0; b < 8; b++) {
        const yellow = Math.floor((a + b) / 5) % 2 === 0;
        const c = b === 0 || b === 7 ? C('#0e0e10') : yellow ? C('#e2b33a') : C('#1b1b1f');
        if (horizontal) put(x0 + a, y0 + b, c); else put(y0 + b, x0 + a, c);
      }
    }
    for (let d = 0; d < 3; d++) {
      const cx = next(0, FLOOR_UNITS) * TILE_PX + TILE_PX / 2, cy = next(0, FLOOR_UNITS) * TILE_PX + TILE_PX / 2;
      for (let y = -10; y <= 10; y++) for (let x = -10; x <= 10; x++) {
        const r = Math.sqrt(x * x + y * y); if (r > 10) continue;
        put(cx + x, cy + y, r > 8.5 ? C('#495868') : r > 7.5 ? C('#0a0f12') : (x + 20) % 3 === 0 ? C('#3a4856') : C('#0a0f12'));
      }
    }
    for (let cable = 0; cable < 2; cable++) {
      const y0 = next(0, n), waves = 2 + cable, amp = 20 + cable * 14;
      const dark = cable === 0 ? C('#24407a') : C('#7a2e36'), light = cable === 0 ? C('#4c74c2') : C('#c0505a');
      for (let x = 0; x < n; x++) {
        const y = y0 + Math.round(amp * Math.sin(x * Math.PI * 2 * waves / n));
        put(x, y - 1, C('#0b0f12')); put(x, y, dark); put(x, y + 1, light); put(x, y + 2, dark);
      }
    }
    for (let p = 0; p < 6; p++) {
      const cx = next(0, n), cy = next(0, n), blobs = next(3, 6), mask = new Uint8Array(n * n);
      for (let b = 0; b < blobs; b++) {
        const bx = cx + next(-16, 17), by = cy + next(-10, 11), r = next(4, 11);
        for (let y = -r; y <= r; y++) for (let x = -r; x <= r; x++) if (x * x + y * y <= r * r) mask[wrap(by + y) * n + wrap(bx + x)] = 1;
      }
      for (let i = 0; i < mask.length; i++) if (mask[i]) blend(i % n, (i / n) | 0, C('#2fc46c'), 0.5);
      for (let g = 0; g < 4; g++) put(cx + next(-8, 9), cy + next(-5, 6), C('#8cf0b0'));
    }
    for (let k = 0; k < 7; k++) {
      let x = next(0, n), y = next(0, n); const steps = next(16, 40);
      for (let i = 0; i < steps; i++) { put(x, y, C('#0e1418')); x += next(0, 2) === 0 ? 1 : 0; y += next(-1, 2); }
    }
    const cv = document.createElement('canvas'); cv.width = cv.height = n;
    cv.getContext('2d').putImageData(new ImageData(f, n, n), 0, 0);
    return cv;
  }

  function chooseCard(i) {
    if (state !== 'levelup' || i < 0 || i >= cards.length || !cardsReady()) return;
    const c = cards[i];

      case 'augment': {
        const have = stacks.get(c.augment.id) || 0;

          if (how === 'set') mods[key] = v; else mods[key] += v;

  // ================================================================== 효과
  // kind: circle(속이 찬 원) · ring(고리) · glow(퍼지는 빛) · beam(막대) · img(그림)
  function spawnFx(kind, at, color, from, to, life, order, alpha = 1) {
    if (fxs.length >= T.MaxFx) return null;
    const f = { alive: true, kind, pos: { x: at.x, y: at.y }, color, from, to, life, age: 0, order, alpha, vx: 0, vy: 0, drag: 0, rot: 0, spin: 0, sx: 1, sy: 1, img: null, flip: false };

  }
  function updateFx(dt) {
    for (const f of fxs) {
      if (!f.alive) continue;
      f.age += dt;
      if (f.age >= f.life) { f.alive = false; continue; }
      if (f.vx || f.vy) {
        f.pos.x += f.vx * dt; f.pos.y += f.vy * dt;
        if (f.drag > 0) { const k = Math.exp(-f.drag * dt); f.vx *= k; f.vy *= k; }
      }
      if (f.spin) f.rot += f.spin * dt;
    }
    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i]; t.age += dt; t.pos.y += 0.5 * dt;

    bannerTime = Math.max(-1, bannerTime);
  }
  const glow = (at, color, size, life) => spawnFx('glow', at, color, size, size * 1.3, life, 11);
  function sparks(at, color, n, speed, size, life) {
    for (let i = 0; i < n; i++) {
      const f = spawnFx('glow', at, color, size * 2.4, 0, life * rand(0.6, 1.2), 12);
      if (!f) return;
      const d = rotate({ x: 1, y: 0 }, Math.random() * Math.PI * 2), s = speed * rand(0.4, 1);
      f.vx = d.x * s; f.vy = d.y * s; f.drag = 4;
    }
  }
  function beam(a, b, width, color, life, order, alpha = 1) {
    const f = spawnFx('beam', { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 }, color, 1, 1, life, order, alpha);
    if (!f) return null;
    f.sx = len(b.x - a.x, b.y - a.y); f.sy = width; f.rot = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;

  function lightning(from, to, color, width) {

      if (i < 6) next = { x: next.x + rand(-0.15, 0.15), y: next.y + rand(-0.15, 0.15) };
      beam(prev, next, width * 3.5, color, 0.2, 11, 0.45);

  }

  }

  }

  // ================================================================== 그리기: 월드
  const sx = x => W / 2 + (x - cam.x) * ppu;

  function drawImg(img, x, y, w, h, pivotX = 0.5, pivotY = 0.5, flip = false, alpha = 1, rotDeg = 0) {
    ctx.save();

    ctx.restore();
  }
  function drawFx(f) {
    const k = f.age / f.life, size = f.from + (f.to - f.from) * k, a = f.alpha * (1 - k);
    if (a <= 0.003) return;
    const x = sx(f.pos.x), y = sy(f.pos.y);
    switch (f.kind) {
      case 'circle':
        ctx.fillStyle = fade(f.color, a); ctx.beginPath(); ctx.arc(x, y, Math.max(0, size / 2 * ppu), 0, Math.PI * 2); ctx.fill(); break;
      case 'ring': {
        const r = Math.max(0, size / 2 * ppu);

      }

        ctx.restore(); break;
      case 'img':

  function drawWorld() {

    // 경험치 방울

    }
    for (const z of zones) if (z.alive && z.kind === 'vortex') drawZone(z);
    for (const f of fxs) if (f.alive && f.order >= 0 && f.order < 5) drawFx(f);
    // 적 (보스는 뒤에)
    const ordered = enemies.filter(e => e.alive).sort((a, b) => (isBoss(a) - isBoss(b)) || (b.pos.y - a.pos.y));
    for (const e of ordered) {

      const wob = Math.sin(elapsed * (isBoss(e) ? 5 : 9) + e.serial * 1.3), s = e.scale * e.fade;
      const img = e.flash > 0 ? m.flash : e.stun > 0 ? m.stunned : m.normal;

    const frame = walking && Math.floor(walkTime * 8) % 2 === 1 ? 1 : 0;
    const set = hurtFlash > 0 ? ART.hero.hurt : eBuff > 0 ? ART.hero.haste : ART.hero.normal;
    const bob = walking ? Math.abs(Math.sin(walkTime * 16)) * 0.03 : 0;
    const blink = elapsed < invulnUntil ? (Math.floor(elapsed * 20) % 2 === 0 ? 0.45 : 0.9) : 1;
    drawImg(set[frame], ppos.x, ppos.y + bob, 0.5, 0.625, 0.5, HERO_PIVOT_Y, flipPlayer, blink);

      ctx.fillStyle = fade(lc, 0.55); ctx.fillRect(0, -b.width * 1.2 * pulse * ppu, b.length * ppu, b.width * 2.4 * pulse * ppu);

  function drawZone(z) {

  // ================================================================== 그리기: 화면 글자·버튼 (세로 720 기준 가상 좌표)
  const FONT_BODY = '"Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
  const FONT_TITLE = '"Black Han Sans", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif';
  function fill(x, y, w, h, color) { ctx.fillStyle = color; ctx.fillRect(x * u, y * u, w * u, h * u); }
  function wrapLines(s, maxW) {
    const out = [];
    for (const para of s.split('\n')) {
      if (maxW == null) { out.push(para); continue; }
      let line = '';
      for (const ch of para) {
        const test = line + ch;
        if (line && ctx.measureText(test).width > maxW) {
          const sp = line.lastIndexOf(' ');
          if (sp > 0 && ch !== ' ') { out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; } else { out.push(line); line = ch === ' ' ? '' : ch; }
        } else line = test;
      }
      out.push(line);
    }
    return out;
  }
  // anchor: 'ul' 'uc' 'ml' 'mc' 'mr'

    const { bold = false, wrap = false, shadow = true, title = false } = opts;
    ctx.font = `${title ? 400 : bold ? 700 : 500} ${Math.max(1, size * u)}px ${title ? FONT_TITLE : FONT_BODY}`;
    ctx.textBaseline = 'top';
    const lines = wrapLines(String(s), wrap ? w * u : null), lh = size * u * 1.32, total = lines.length * lh;
    const top = anchor[0] === 'u' ? y * u : y * u + (h * u - total) / 2;
    ctx.textAlign = anchor[1] === 'l' ? 'left' : anchor[1] === 'r' ? 'right' : 'center';
    const tx = anchor[1] === 'l' ? x * u : anchor[1] === 'r' ? (x + w) * u : (x + w / 2) * u;
    lines.forEach((ln, i) => {
      if (shadow) { ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillText(ln, tx + u, top + i * lh + u); }
      ctx.fillStyle = color; ctx.fillText(ln, tx, top + i * lh);
    });
  }
  const over = (x, y, w, h) => mouse.x >= x * u && mouse.x < (x + w) * u && mouse.y >= y * u && mouse.y < (y + h) * u;
  // 버튼: 눌렀다 뗀 위치가 둘 다 안쪽이어야 눌린 것. notBefore 이전에 누르기 시작한 클릭은 무시
  function clicked(x, y, w, h, notBefore = 0) {

  const formatTime = t => { const s = Math.floor(t); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };

  function drawWorldText() {

  function drawSkills() {
    const size = 64, gap = 14, x0 = (vw - (size * 3 + gap * 2)) / 2, y = 618;
    skills.forEach((s, i) => {

  function drawPassives() {

  function drawTitle() {

    if (button(vw / 2 - 120, 340, 240, 56, '시작하기', P.buttonPrimary)) startRun();
    text(0, 402, vw, 22, 'Enter 또는 Space 로도 시작', 14, P.muted, 'mc');
    text(vw / 2 - 320, 460, 640, 120, '우클릭: 이동   ·   적을 좌클릭: 추격하며 자동 공격\nQ W E: 스킬   ·   회전 레이저는 알아서 발동 (레벨업 카드로 배우고 강화)\n1~4: 카드 선택   ·   Tab: 내 빌드 보기   ·   Esc: 일시정지', 16, P.body, 'uc', { wrap: true });
  }
  function drawLevelUp() {
    fill(0, 0, vw, 720, 'rgba(10,8,20,0.72)');
    text(0, 96, vw, 54, elapsed <= 0 ? '시작 증강' : '레벨 업!', 40, P.xp, 'mc', { title: true });
    let sub = '증강을 하나 고르세요  (클릭 또는 1~' + cards.length + ')';
    if (pendingLevelUps > 1) sub += '   ·   남은 선택 ' + pendingLevelUps;
    text(0, 150, vw, 26, sub, 16, P.body, 'mc');
    const ready = cardsReady();
    if (!ready) {
      const k = 1 - Math.max(0, Math.min(1, (cardsReadyAt - performance.now() / 1000) / T.CardPickDelay));
      fill(vw / 2 - 120, 180, 240, 6, P.panel); fill(vw / 2 - 120, 180, 240 * k, 6, P.xp);
    }
    const gap = 18, ch = 300, n = cards.length, cw = Math.min(230, (vw - 40 - gap * (n - 1)) / n), x0 = (vw - (n * cw + (n - 1) * gap)) / 2, y = 200;
    for (let i = 0; i < n; i++) {
      const c = cards[i], x = x0 + i * (cw + gap);
      const hover = ready && over(x, y, cw, ch);
      fill(x, y, cw, ch, hover ? P.cardHover : P.card); fill(x, y, cw, 6, c.color);
      text(x + 16, y + 20, cw - 32, 20, c.tag, 13, c.color, 'ml', { bold: true });
      text(x + 16, y + 44, cw - 32, 56, c.title, 20, P.white, 'ul', { bold: true, wrap: true });
      text(x + 16, y + 104, cw - 32, 150, c.desc, 15, P.body, 'ul', { wrap: true, shadow: false });
      text(x, y + ch - 36, cw, 24, '[' + (i + 1) + ']', 15, P.muted, 'mc');
      if (!ready) { fill(x, y, cw, ch, 'rgba(10,8,20,0.55)'); continue; }
      // 대기 시간 전에 누르기 시작한 클릭은 받지 않는다 (공격하다 잘못 고르는 것 방지)
      if (clicked(x, y, cw, ch, cardsReadyAt)) { chooseCard(i); break; }
    }
  }
  function drawInfo() {
    fill(0, 0, vw, 720, 'rgba(10,8,20,0.86)');
    text(0, 66, vw, 48, '현재 빌드', 34, P.white, 'mc', { title: true });
    text(0, 112, vw, 22, '일시정지 중   ·   Tab 또는 Esc: 돌아가기', 14, P.muted, 'mc');
    const colW = Math.min(360, (vw - 80) / 3), gap = 20, x0 = (vw - (colW * 3 + gap * 2)) / 2, y0 = 150;
    let x = x0, y = y0;
    text(x, y, colW, 26, '능력치', 19, P.xp, 'ml', { bold: true }); y += 34;
    const stats = [
      ['평타 피해', fmt1(attack() * T.BasicDamageBoost)], ['공격 속도', aspd().toFixed(2) + ' /초'], ['평타 사거리', num(range())],
      ['이동 속도', moveSpeed().toFixed(2)], ['치명타', Math.round(critChance() * 100) + '%  ×' + num(critMult())],
      ['체력', Math.ceil(hp) + ' / ' + Math.round(maxHp())], ['초당 회복', fmt1(mods.regen)], ['받는 피해 감소', fmt1(mods.armor)],
      ['흡혈', Math.round(mods.lifesteal * 100) + '%'], ['관통 · 튕김 · 추가탄', mods.pierce + ' · ' + mods.ricochet + ' · ' + mods.multishot],
      ['스킬 피해', '+' + Math.round(mods.skillDmgPct * 100) + '%' + (mods.synergyFinale ? '  ×1.3' : '')], ['스킬 쿨다운', '×' + skillCdMult(mods).toFixed(2)],
      ['경험치 흡수 범위', (T.XpMagnet * (1 + mods.magnetPct)).toFixed(1)],
      ['표창 · 운석 · 블랙홀', (mods.shurikens > 0 ? mods.shurikens + mods.skillAmount : 0) + '개 · ' + Math.round(mods.meteorChance * 100) + '% · ' + Math.round(mods.vortexChance * 100) + '%'],
    ];
    for (const [k, v] of stats) { text(x, y, colW, 22, k, 15, P.body, 'ml'); text(x, y, colW, 22, v, 15, P.white, 'mr', { bold: true }); y += 26; }

    x = x0 + colW + gap; y = y0;
    text(x, y, colW, 26, '스킬', 19, P.skill, 'ml', { bold: true }); y += 34;
    skills.forEach((sk, i) => {
      const head = SKILL_KEYS[i] + '  ' + SKILL_NAMES[i];
      if (sk.level === 0) { text(x, y, colW, 24, head, 17, P.locked, 'ml', { bold: true }); text(x, y + 24, colW, 20, '잠김 (레벨업 카드로 배움)', 14, P.locked, 'ml'); }
      else {
        const c = sk.evolved ? P.legendary : P.skill, coef = i === 0 ? qDamage(sk.level) : i === 1 ? wDamage(sk.level) : eDamage(sk.level);
        text(x, y, colW, 24, head + '   ' + (sk.evolved ? '진화' : 'Lv ' + sk.level), 17, c, 'ml', { bold: true });
        text(x, y + 24, colW, 20, '피해 ' + Math.round(skillDamage(i, coef)) + '   ·   쿨다운 ' + skillCooldown(i, sk.level, skillCdMult(mods)).toFixed(1) + '초', 14, P.body, 'ml');
      }
      y += 50;
    });
    text(x, y, colW, 24, '패시브 스킬', 17, P.skill, 'ml', { bold: true }); y += 28;
    passives.forEach((ps, id) => {
      if (!ps.level) return;
      const c = ps.evolved ? P.legendary : PASSIVE.colors[id];
      text(x, y, colW, 20, (ps.evolved ? PASSIVE.evolveNames[id] : PASSIVE.names[id]) + '   ' + (ps.evolved ? '진화' : 'Lv ' + ps.level), 15, c, 'ml', { bold: true });
      text(x, y + 19, colW, 18, '피해 ' + Math.round(passiveDamage(id, PASSIVE.coef(id, ps.level))) + '   ·   쿨다운 ' + PASSIVE.cooldown(id, ps.level, skillCdMult(mods)).toFixed(1) + '초', 12, P.body, 'ml');
      y += 40;
    });
    text(x, y + 6, colW, 22, '생존 ' + formatTime(elapsed) + '   ·   처치 ' + kills + '   ·   Lv ' + level + '   ·   레벨 보너스 ×' + levelBonus().toFixed(2), 13, P.muted, 'ml', { wrap: true });

    x = x0 + (colW + gap) * 2; y = y0;
    text(x, y, colW, 26, '증강  ' + pickedOrder.length + '종', 19, P.legendary, 'ml', { bold: true }); y += 34;
    if (!pickedOrder.length) text(x, y, colW, 22, '아직 고른 증강이 없어요', 14, P.muted, 'ml');
    const row = Math.min(44, (700 - y) / Math.max(1, pickedOrder.length)), showDesc = row >= 34;
    for (const a of pickedOrder) {
      const have = stacks.get(a.id) || 0, c = P.rarity[a.rarity];
      fill(x, y + 3, 4, Math.max(8, row - 10), c);
      text(x + 12, y, colW - 12, 20, a.name + (have > 1 ? '  ×' + have : ''), 15, c, 'ml', { bold: true });
      if (showDesc) text(x + 12, y + 18, colW - 12, 18, a.desc.replace(/\n/g, ' '), 12, P.body, 'ml');
      y += row;
    }
  }
  function drawPause() {
    fill(0, 0, vw, 720, 'rgba(10,8,20,0.7)');
    text(0, 186, vw, 64, '일시정지', 46, P.white, 'mc', { title: true });
    const x = vw / 2 - 120;
    if (button(x, 290, 240, 54, '계속하기', P.buttonPrimary)) setPaused(false);
    if (button(x, 358, 240, 54, '다시 시작', P.buttonSecondary)) startRun();
    if (button(x, 426, 240, 54, '타이틀로', P.buttonSecondary)) goTitle();
  }
  function drawGameOver() {
    fill(0, 0, vw, 720, 'rgba(10,8,20,0.75)');
    text(0, 136, vw, 64, '쓰러졌습니다', 52, P.hurt, 'mc', { title: true });
    if (newRecord) text(0, 202, vw, 30, '새 최고 기록!', 22, P.legendary, 'mc', { bold: true });
    text(0, 240, vw, 36, '생존 시간  ' + formatTime(elapsed), 28, P.white, 'mc', { bold: true });
    text(0, 282, vw, 26, '처치 ' + kills + '   ·   레벨 ' + level, 18, P.body, 'mc');
    text(0, 314, vw, 24, '최고 기록 ' + formatTime(bestTime) + '   ·   최다 처치 ' + bestKills, 16, P.muted, 'mc');
    if (button(vw / 2 - 250, 380, 240, 56, '다시 시작', P.buttonPrimary)) startRun();
    if (button(vw / 2 + 10, 380, 240, 56, '타이틀로', P.buttonSecondary)) goTitle();
    text(0, 448, vw, 22, 'Enter: 다시 시작', 14, P.muted, 'mc');
  }

  function draw() {
    ctx.fillStyle = P.ground; ctx.fillRect(0, 0, W, H);
    drawWorld();
    if (state !== 'title') drawWorldText();
    if (state === 'playing' || state === 'paused' || state === 'levelup' || state === 'info') drawHud();
    if (state === 'title') drawTitle();
    else if (state === 'levelup') drawLevelUp();
    else if (state === 'paused') drawPause();
    else if (state === 'info') drawInfo();
    else if (state === 'gameover') drawGameOver();
  }

  // ================================================================== 화면 크기·시작
  function resize() {
    const maxW = Math.min(document.querySelector('.wrap').clientWidth, (window.innerHeight - 70) * 16 / 9);
    const cssW = Math.max(320, Math.floor(maxW)), cssH = Math.round(cssW * 9 / 16), dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = cssW + 'px'; canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    W = canvas.width; H = canvas.height; u = H / 720; vw = W / u; ppu = H / (2 * T.CameraSize);
  }
  window.addEventListener('resize', resize);

  buildArt();
  resize();
  resetRun();

  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now;
    update(dt);
    // 카메라: 플레이어를 따라가고, 게임 중에만 흔들린다
    let ox = 0, oy = 0;
    if (state === 'playing' && shake > 0) { const o = insideUnitCircle(); ox = o.x * shake * T.ShakeStrength; oy = o.y * shake * T.ShakeStrength; shake = Math.max(0, shake - dt * 3); }
    cam = { x: ppos.x + ox, y: ppos.y + oy };
    draw();
    keysDown.clear(); mouse.leftDown = false; mouse.rightDown = false; click = null;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // 자동 테스트용: 주소 끝이 #test 일 때만 켜진다 (게임 진행을 빨리 돌리고 증강·스킬을 바로 준다)
  if (location.hash === '#test') {
    window.__arcaneDrift = {
      get state() { return state; }, get elapsed() { return elapsed; }, get kills() { return kills; }, get level() { return level; },
      get enemies() { return enemies.length; }, get hp() { return hp; }, get fx() { return fxs.length; }, get zones() { return zones.length; },
      get meteors() { return meteors.length; }, get shurikens() { return shurikenPos.length; }, get beams() { return laserBeams.length; },
      run(steps) { for (let i = 0; i < steps && state === 'playing'; i++) step(1 / 60); },
      give(id, times = 1) { const a = AUGMENTS.find(x => x.id === id); for (let k = 0; k < times; k++) { stacks.set(id, (stacks.get(id) || 0) + 1); if (!pickedOrder.includes(a)) pickedOrder.push(a); for (const [key, v, how] of a.effects) { if (how === 'set') mods[key] = v; else mods[key] += v; } } },
      learnAll() { skills.forEach(s => { s.level = 5; s.evolved = true; }); passives.forEach(p => { p.level = 5; p.evolved = true; p.timer = 0; }); },
      godMode() { mods.maxHp = 1e8; hp = 1e8; },
      cast(key) { keysDown.add(key); },
      pick(i) { cardsReadyAt = 0; chooseCard(i); },
      cards() { return cards.map(c => c.title); },
    };
  }
})();
</script>
</body>
